version: '3.8'

services:
  # Database (PostgreSQL)
  db:
    image: postgres:15
    container_name: omnimetric-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omnimetric_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # Object Storage (MinIO)
  minio:
    image: quay.io/minio/minio
    container_name: omnimetric-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  # The AI Backend (FastAPI)
  backend:
    build: ./backend
    container_name: future_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@db:5432/omnimetric_db
      
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_REGION=us-east-1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=omnimetric-storage

  # The Frontend (Next.js)
  frontend:
    build: ./frontend
    container_name: future_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PYTHONUNBUFFERED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true